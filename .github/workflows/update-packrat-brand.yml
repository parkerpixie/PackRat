name: Apply PackRat header mascot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace header mascot only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old_css = '.brand-mark{width:29px;height:29px;border:1px solid rgba(255,255,255,.42);border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto}.brand-mark:before,.brand-mark:after{content:"";position:absolute;width:8px;height:8px;border:1px solid rgba(255,255,255,.62);border-radius:50%;top:-2px;background:var(--ink)}.brand-mark:before{left:3px}.brand-mark:after{right:3px}.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--pink)}'
          new_css = '.brand-mark{width:36px;height:36px;display:block;object-fit:contain;flex:0 0 auto}'
          old_markup = '<span class="brand-mark"><span class="brand-dot"></span></span>'
          new_markup = '<img class="brand-mark" src="Graphics/PackRatwithLuggage.png" alt="" aria-hidden="true">'

          if old_css not in text:
              raise SystemExit('Expected PackRat brand CSS not found; refusing to touch anything else.')
          if old_markup not in text:
              raise SystemExit('Expected PackRat brand markup not found; refusing to touch anything else.')
          if 'url("Graphics/Pack%20Rat%20App%20Long%20Banner.png")' not in text:
              raise SystemExit('Hero graphic is not in the expected state; refusing to modify.')
          if 'background-image:url("Graphics/Luna%20and%20Ozzy%20in%20Car.png")' not in text:
              raise SystemExit('Saturday graphic is not in the expected state; refusing to modify.')

          text = text.replace(old_css, new_css, 1).replace(old_markup, new_markup, 1)
          path.write_text(text)
          Path('.github/workflows/update-packrat-brand.yml').unlink()
          PY
      - name: Commit the single visual change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-packrat-brand.yml
          git commit -m "Use uploaded PackRat mascot in header"
          git push
