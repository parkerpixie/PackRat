name: PackRat staged launch queue fix

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.event.pull_request.title == 'Update PackRat Sunday launch queue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Make Sunday bar explicit plus staged items
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''function truckStats(){const lists=Object.entries(state.data?.lists||{}).filter(([id,list])=>{const hay=`${id} ${list?.title||""} ${list?.shortTitle||""} ${list?.subtitle||""}`.toLowerCase();const bags=/(bags?.*(truck|car)|(truck|car).*bags?)/.test(hay);const finalCheck=/(before\\s*(we\\s*)?leave|right\\s*before|last[\\s_-]*minute|final\\s*check)/.test(hay);return bags||finalCheck||id==="lastMinute"}).map(([,list])=>list);return sumLists(lists)}'''
          new = '''function truckStats(){const all=Object.entries(state.data?.lists||{});const departureIds=new Set(all.filter(([id,list])=>{const hay=`${id} ${list?.title||""} ${list?.shortTitle||""}`.toLowerCase();return id==="lastMinute"||/bags?\\s*to\\s*(truck|car)/.test(hay)||/(door\\s*check|before\\s*(we\\s*)?leave)/.test(hay)}).map(([id])=>id));const seen=new Set(),items=[];all.forEach(([id,list])=>(list?.items||[]).forEach(item=>{const key=`${id}:${item.id||item.text}`;if(seen.has(key))return;if(departureIds.has(id)||statusOf(item)==="staged"){seen.add(key);items.push(item)}}));return listStats({items})}'''
          if old not in s:
              raise SystemExit('Expected truckStats function not found; refusing unsafe patch')
          s = s.replace(old, new)
          s = s.replace('Bags to Truck + Before We Leave · load at 6:00 · leave 6:30–7:00','Door Check + Bags to Truck + anything Staged · load at 6:00 · leave 6:30–7:00')
          p.write_text(s)
          PY
      - name: Commit launch queue change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Include staged items in Sunday launch queue"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
